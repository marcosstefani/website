name: Keep Portfolio Warm

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Approx. Portugal (WEST, UTC+1): 05:05, 12:05, 23:05
    - cron: "5 4 * * *"
    - cron: "5 11 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:

jobs:
  ping-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping portfolio homepage
        run: |
          curl -fsS -L \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 30 \
            --user-agent "github-actions-keepalive" \
            "https://marcosstefani.com/" > /dev/null
