name: Keep Portfolio Warm

on:
  schedule:
    # GitHub Actions cron uses UTC. Runs every hour every day.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping portfolio homepage
        run: |
          curl -fsS -L \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 30 \
            --user-agent "github-actions-keepalive" \
            "https://marcosstefani.com/" > /dev/null
